name: windows-build

on:
  workflow_dispatch: {}   # 手动: Actions 页 → windows-build → Run workflow
  push:
    branches: [main]
    paths:
      - "engine/**"
      - "gui/**"
      - "packaging/**"
      - ".github/workflows/windows-build.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 Inno Setup
        run: choco install innosetup -y --no-progress

      - name: 构建 (chromedriver + PyInstaller + 安装包)
        shell: pwsh
        run: ./packaging/build-windows.ps1

      - name: 上传构建日志 (失败排障)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt

      - name: 提交构建日志到 ci-log 分支
        if: always()
        shell: bash
        run: |
          git config user.email "ci@example.com"
          git config user.name "ci-log-bot"
          git add build-log.txt || exit 0
          git commit -m "CI 构建日志 $(git rev-parse --short HEAD)" || exit 0
          git push -f origin "HEAD:refs/heads/ci-log" || exit 0

      - name: 上传绿色目录
        uses: actions/upload-artifact@v4
        with:
          name: yuketang-helper-windows
          path: dist/ykt-helper-gui/

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: dist/installer/*.exe
